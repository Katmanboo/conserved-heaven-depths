<style>
/* Layout: one-screen phone game — HUD strip, 3D voxel dungeon with joystick, message ledger, technique bar */
:root{

  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:14px;line-height:1.4;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;

#app{height:100%;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;align-items:center}
.hud .top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.realm{font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#btrial{padding:3px 8px;font-size:12px;border-color:var(--gold);color:var(--gold);background:#2a2716;animation:glow 1.4s ease-in-out infinite alternate;white-space:nowrap}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(224,184,74,0)}to{box-shadow:0 0 10px 1px rgba(224,184,74,.5)}}
.floor{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.bar{position:relative;height:16px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;display:block;transition:width .2s}
.bar span{position:relative;display:block;font-family:var(--f-mono);font-size:11px;padding-left:6px;line-height:15px;color:var(--ink);text-shadow:0 1px 2px #000}
#hpb{background:var(--cinnabar)}#qib{background:var(--qi)}#esb{background:var(--gold)}
.ess{grid-column:1/-1;height:5px}
#stage{flex:1;min-height:0;position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#0a0e0d;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ft{position:absolute;font-family:var(--f-mono);font-weight:600;font-size:14px;text-shadow:0 1px 3px #000;transform:translate(-50%,-50%);white-space:nowrap}
.mhp{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:3px}
.mhp b{font-family:var(--f-display);font-size:13px;text-shadow:0 1px 2px #000}
.mhp i{display:block;width:30px;height:4px;background:#000;border-radius:2px;overflow:hidden}
.mhp i s{display:block;height:100%;background:var(--cinnabar)}
.mhp.boss i{width:56px}.mhp.boss i s{background:var(--gold)}
#joy{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:14px;width:104px;height:104px;border-radius:50%;border:1.5px solid rgba(223,231,226,.18);background:rgba(223,231,226,.04);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(224,184,74,.25);border:1.5px solid rgba(224,184,74,.6)}
#camhint{position:absolute;right:10px;top:8px;font-size:11px;color:rgba(223,231,226,.45);pointer-events:none;text-align:right}
#drawbtn{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:100px;border-radius:18px;border:1.5px solid rgba(127,182,255,.7);background:rgba(40,80,130,.55);color:#cfe6ff;font:600 12.5px var(--f-body);padding:7px 11px}
#dashbtn{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:16px;width:74px;height:74px;border-radius:50%;border:1.5px solid rgba(224,184,74,.6);background:rgba(224,184,74,.14);color:var(--gold);font:600 13px var(--f-body);display:grid;place-items:center;pointer-events:auto;touch-action:none;line-height:1.1;text-align:center}
#dashbtn.cd{opacity:.35;border-color:rgba(223,231,226,.25);color:var(--muted)}
#dashbtn b{font-size:20px;display:block}
#matlist{position:absolute;left:8px;top:46px;max-width:min(62%,330px);background:rgba(10,14,13,.86);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:11.5px;line-height:1.35;pointer-events:none;color:var(--ink,#dfe7e2)}#matlist b{color:var(--gold)}#matlist .ml-f{color:var(--cinnabar)}#matlist .ml-v{color:#9fd3ff}
#aimtip{position:absolute;left:8px;right:8px;top:8px;background:rgba(10,14,13,.88);border:1px solid var(--gold);color:var(--gold);font-size:12.5px;padding:6px 9px;border-radius:4px;display:flex;justify-content:space-between;gap:8px;align-items:center}
#aimtip button{padding:3px 8px;font-size:12px}
#medbadge{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:12px;color:var(--qi);background:rgba(10,14,13,.8);border:1px solid var(--qi);border-radius:4px;padding:3px 8px;pointer-events:none}
#nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted)}
#log{height:52px;overflow:hidden;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;justify-content:flex-end}
#log div:last-child{color:var(--ink)}
#log b{color:var(--gold);font-weight:600}
#log code,.eq{font-family:var(--f-mono);font-size:11.5px;color:var(--jade)}
.spells{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.slot{min-height:54px;padding:5px 4px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:2px;font:inherit;cursor:pointer;position:relative;overflow:hidden}
.slot .sn{font-size:11px;font-weight:600;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slot .sq{font-family:var(--f-mono);font-size:10.5px;color:var(--qi);margin-top:auto}
.slot .sw{position:absolute;left:0;top:0;bottom:0;width:3px}
.slot.empty{color:var(--muted);border-style:dashed;align-items:center;justify-content:center;font-size:11px}
.slot.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.slot.no{opacity:.45}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.acts button{padding:8px 2px;font-size:12.5px}
button{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:4px;padding:8px 6px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
button:focus-visible,.chip:focus-visible,.pt:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button.pri{background:var(--cinnabar);border-color:var(--cinnabar);color:#140b09}
button.on{border-color:var(--qi);color:var(--qi)}
button:disabled{opacity:.4;cursor:default}
/* sheets */
.sheet{position:fixed;inset:0;background:rgba(5,8,7,.78);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.sheet .in{width:100%;max-width:620px;max-height:92%;overflow:auto;background:var(--panel);border-top:2px solid var(--cinnabar);border-radius:8px 8px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet .in>*{flex:none}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0;text-wrap:balance}
.sheet h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.sheet p{margin:0;color:var(--muted);font-size:13px;max-width:62ch}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:4px;padding:6px 8px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;text-align:left}
.chip small{font-family:var(--f-mono);font-weight:400;color:var(--muted);font-size:11px}
.chip.on{border-color:var(--gold);background:#2a2716}
.chip.off{opacity:.45}
.chip.rx{border-color:#2f5c4c}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.25);display:inline-block}
.ledger{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.ledger .r{display:flex;justify-content:space-between;gap:10px}
.ledger .r span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.ledger .tot{border-top:1px solid var(--line);padding-top:5px;margin-top:2px;font-weight:600}
.becomes{background:#14201b;border:1px solid #2f5c4c;border-radius:4px;padding:9px 10px;display:flex;flex-direction:column;gap:5px}
.becomes .eq{font-size:12.5px;overflow-wrap:anywhere}
.becomes p{color:var(--ink)}
.warn{color:var(--gold);font-size:12.5px}
.bad{color:var(--cinnabar);font-size:12.5px}
.good{color:var(--jade);font-size:12.5px}
input[type=range]{width:100%;accent-color:var(--gold)}
input[type=text]{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%}
.pouch{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:13px}
.pouch>span:nth-child(2n){font-family:var(--f-mono);color:var(--muted);text-align:right}
.relic{display:flex;flex-direction:column;gap:1px;padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--panel2)}
.relic b{font-size:13px}.relic span{font-size:12px;color:var(--muted)}
.title{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9vw,44px);line-height:1;margin:0;color:var(--ink)}
.seal{display:inline-grid;place-items:center;width:46px;height:46px;border:2.5px solid var(--cinnabar);color:var(--cinnabar);font-family:var(--f-display);font-weight:800;font-size:12px;line-height:1.05;text-align:center;transform:rotate(-3deg);border-radius:4px;flex:none}
.guide li{margin-bottom:4px;color:var(--muted);font-size:13px}
.guide b{color:var(--ink)}
.qopts{display:flex;flex-direction:column;gap:7px}
.qopts button{text-align:left;padding:11px 12px;font-weight:600;font-size:14px}
.qopts button:disabled{opacity:.85}
.qopts button.right{opacity:1;border-color:var(--jade);background:#16302a}
.qopts button.wrong{border-color:var(--cinnabar);background:#33191a}
.qtext{font-size:16px;color:var(--ink);font-weight:600;line-height:1.4}
.pips{display:flex;gap:5px}.pips i{width:22px;height:5px;border-radius:2px;background:var(--line)}.pips i.ok{background:var(--jade)}.pips i.cur{background:var(--gold)}
.codex{display:flex;flex-direction:column;gap:8px}
.codex div{border-left:2px solid #2f5c4c;padding-left:9px}
.codex b{font-size:13px}.codex .eq{display:block;margin:2px 0}.codex span{font-size:12.5px;color:var(--muted)}
/* periodic table */
.ptwrap{overflow-x:auto}
.ptab{display:grid;grid-template-columns:repeat(18,minmax(18px,1fr));gap:2px;min-width:340px}
.pt{aspect-ratio:1;border:1px solid var(--line);border-radius:2px;background:var(--panel2);color:var(--ink);padding:0;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;line-height:1;border-top-width:3px}
.pt b{font-size:clamp(8px,2.4vw,13px);font-weight:600}
.pt small{font-family:var(--f-mono);font-size:clamp(6px,1.6vw,9px);color:var(--muted)}
.pt.has::after{content:"";position:absolute;right:1px;bottom:1px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.pt.dim{opacity:.32}
.pt.sel{outline:2px solid var(--gold);outline-offset:0}
.pt.rx{box-shadow:inset 0 0 0 1px var(--jade)}
.molgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.mol{border:1px solid var(--line);border-radius:4px;padding:8px 9px;background:var(--panel2);display:flex;flex-direction:column;gap:3px;min-width:0}
.mol .f{font-family:var(--f-mono);font-size:16px;color:var(--jade);overflow-wrap:anywhere}
.mol b{font-size:13px}.mol span{font-size:12px;color:var(--muted)}
.mol.lock{opacity:.55;border-style:dashed}.mol.lock .f{color:var(--muted)}
.mol.hint{border-color:var(--gold);border-style:dashed}
.mol button{margin-top:4px;padding:5px 6px;font-size:12px}
.ptgap{grid-column:1/-1;height:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.edetail{border:1px solid var(--line);border-radius:4px;padding:10px;background:var(--paper);display:flex;flex-direction:column;gap:6px}
.edetail .big{display:flex;gap:10px;align-items:center}
.edetail .sym{font-family:var(--f-display);font-weight:800;font-size:32px;width:58px;height:58px;display:grid;place-items:center;border:1px solid var(--line);border-top-width:4px;border-radius:3px;flex:none}
/* vessels */
.vessel{border:1px solid var(--line);border-radius:4px;padding:9px 10px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.gauge{height:8px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.gauge i{display:block;height:100%}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}#btrial{animation:none}}
</style>

/* ---------- floor generation ---------- */
function buildFloor(){

  G.veins={};G.mobs=[];G.clouds=[];G.traps=[];G.items={};G.walk=null;G.remains={};G.decaying=[];G.mine={};G.oreWalls={};G.quarry=null;G.quarrySeen=false;
  const rooms=[];const boss=bossOf(G.floor);

    const w=ri(4,8),h=ri(4,7),x=ri(1,W-w-2),y=ri(1,H-h-2);
    if(rooms.some(r=>x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y))continue;
    rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)})}
  if(boss){const r=rooms[rooms.length-1];r.w=Math.min(11,W-r.x-2);r.h=Math.min(10,H-r.y-2);r.cx=r.x+(r.w>>1);r.cy=r.y+(r.h>>1)}

    for(let y=py-1;y<=py+1;y++)for(let x=px-1;x<=px+1;x++)if(tile(x,y)===T.FLOOR&&rnd()<.75)G.map[idx(x,y)]=T.WATER}
  const start=rooms[0];G.p.x=start.cx;G.p.y=start.cy;G.p.fx=start.cx;G.p.fz=start.cy;G.map[idx(start.cx,start.cy)]=T.FLOOR;
  const end=rooms[rooms.length-1];

  const free=(x,y)=>tile(x,y)===T.FLOOR&&!(x===G.p.x&&y===G.p.y)&&!G.veins[idx(x,y)]&&!G.items[idx(x,y)]&&!(x===end.cx&&y===end.cy);

    if(!free(x,y))continue;const el=pick(B.veins);G.veins[idx(x,y)]={el,amt:isGas(el)?ri(8,14):ri(4,8)};k++}
  // the quarry: one room whose walls are shot through with ore; elsewhere a few stray ore seams

  if(qroom){G.quarry={x:qroom.x,y:qroom.y,w:qroom.w,h:qroom.h};
    for(let y=qroom.y-1;y<=qroom.y+qroom.h;y++)for(let x=qroom.x-1;x<=qroom.x+qroom.w;x++)if(tile(x,y)===T.WALL&&x>0&&y>0&&x<W-1&&y<H-1&&rnd()<.75)G.oreWalls[idx(x,y)]=pick(ores)}
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(tile(x,y)===T.WALL&&!G.oreWalls[idx(x,y)]&&rnd()<.025){let nf=false;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(passable(x+dx,y+dy))nf=true;if(nf)G.oreWalls[idx(x,y)]=pick(ores)}
  const nC=boss?2:3+(rnd()<.7?1:0)+(rnd()<.4?1:0)+(G.floor%3===0?1:0);
  for(let k=0,t=0;k<nC&&t<300;t++){const r=pick(rooms.slice(1));if(!r)break;const x=ri(r.x,r.x+r.w-1),y=ri(r.y,r.y+r.h-1);
    if(!free(x,y))continue;G.items[idx(x,y)]={kind:"chest",tier:rnd()<Math.min(.45,.06*G.floor)?1:0};k++}
  for(let k=0,t=0,nS=ri(1,3);k<nS&&t<300;t++){const r=pick(rooms.slice(1));if(!r)break;const x=ri(r.x,r.x+r.w-1),y=ri(r.y,r.y+r.h-1);if(free(x,y)){G.items[idx(x,y)]={kind:"satchel"};k++}}
  for(let k=0,t=0,nH=ri(3,5);k<nH&&t<300;t++){const r=pick(rooms);const x=ri(r.x,r.x+r.w-1),y=ri(r.y,r.y+r.h-1);
    if(!free(x,y))continue;G.items[idx(x,y)]={kind:rnd()<.5?"grass":"lotus"};k++}
  if(rnd()<.55){for(let t=0;t<200;t++){const r=pick(rooms.slice(1));if(!r)break;const x=ri(r.x,r.x+r.w-1),y=ri(r.y,r.y+r.h-1);if(free(x,y)){G.items[idx(x,y)]={kind:"tablet"};break}}}
  for(let k=0,t=0,ns=rnd()<.7?ri(1,2):0;k<ns&&t<200;t++){const r=pick(rooms.slice(1));if(!r)break;const x=ri(r.x,r.x+r.w-1),y=ri(r.y,r.y+r.h-1);if(free(x,y)){G.items[idx(x,y)]={kind:"scroll"};k++}}
  try{placeNPC(free,rooms)}catch(e){console.error(e)}

    const n=D.swarm?ri(D.swarm[0],D.swarm[1]):(rnd()<.25&&G.floor>2?2:1);for(let i=0;i<n;i++)spawn(type,r,sc,dc)}

function spawn(type,r,sc,dc,center){

  if(h){while(x!==x2){x+=Math.sign(x2-x);step()}while(y!==y2){y+=Math.sign(y2-y);step()}}
  else{while(y!==y2){y+=Math.sign(y2-y);step()}while(x!==x2){x+=Math.sign(x2-x);step()}}}

/* ---------- sight ---------- */
const SIGHT=8;
function los(x0,y0,x1,y1){let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx-dy,x=x0,y=y0;

/* ---------- Qi vessels ---------- */
function vCapacity(v,el){return isGas(el)?Math.floor(v.bar*v.V/BAR_PER):Math.floor(v.V*400)}

function vesselFormCost(V,bar,mat){const base=2+V*bar/40;return Math.ceil(mat==="iron"?base*.5:base)}

  G.vessels=G.vessels.filter(x=>x!==v);const gam=["He","Ne","Ar","Kr","Xe","Rn"].includes(v.el)?1.67:v.el==="marsh"?1.31:1.4;const Eb=.1*Math.max(0,P-1)*v.V/(gam-1);const d=eDmg(Eb,.5);

  if(v.el==="water"&&v.h>418){const sc=vKg(v)*(Math.min(v.h,3400)-155)*.4;hurtPlayer(eDmg(sc,1),"self","fire");say("Scalding steam bursts over you.")}if(v.el==="Fe"&&v.h>1297)hurtPlayer(eDmg(vKg(v)*v.h*.3,1),"self","fire");
  hurtPlayer(d,"self");codexAdd("rupture","A vessel ruptures","P > rated pressure","Gas pushes on the walls in proportion to how much is packed in (PV = nRT). Past the rating the walls give, and the gas releases (P − P₀)V/(γ − 1) as a blast.")}

  if(!cands.length){say(`A vent of <b>${rname(el)}</b> hisses here, but every vessel is full of something else. Vent one, or form a new vessel in Vessels.`);return 0}

/* ---------- spell evaluation: the conservation ledger ---------- */
function veinsInReach(el){const rr=reach(),out=[];
  for(const k in G.veins){const v=G.veins[k];if(v.el!==el||v.amt<=0)continue;if(dist(k%W,(k/W)|0,G.p.x,G.p.y)<=rr)out.push(v)}return out}
function waterNear(){const rr=reach();for(let dy=-rr;dy<=rr;dy++)for(let dx=-rr;dx<=rr;dx++)if(tile(G.p.x+dx,G.p.y+dy)===T.WATER)return true;return false}
/* ambient sources. Qi per measure follows conservation: O₂ and N₂ in air only need separating (cheap);
   the C and H in air, water and rock are already burned (CO₂, H₂O, oxides), so pulling them back out costs
   at least the energy burning would return. Your body's fat and sugar are unburned fuel — cheap in Qi, paid in HP. */
const AIRQ={dryice:.15,water:.1,O:.12,N:.05,Ar:1.5,Ne:5,He:6,Kr:7,Xe:8,C:7,H:6};
const ROCKQ={O:3,Si:3,Al:5,Fe:5,Mg:5,Ca:5};
const BODYM={O:27000,C:10000,H:63000,N:1400,Ca:250,P:250,K:35,S:44,Na:43,Cl:27,Mg:10,Fe:.7};// measures (0.1 mol) in a 70 kg body
const BODYHP={C:1.2,H:.8,O:.8,N:2,Ca:3,P:3,K:4,S:4,Na:4,Cl:4,Mg:5,Fe:10};
function source(el,need,plan,s){

  if(!isGas(el)){rows.pouch=Math.min(G.pouch[el]||0,left);left-=rows.pouch}
  if(!vFirst){rows.vessel=Math.min(vesselHas(el),left);left-=rows.vessel}

  const thin=G.biome.thin?2:1;
  if(waterNear()){const pc=poolChem();if(pc[el]!=null)opts.push({k:"water",q:pc[el],cap:Infinity})}
  if(AIRQ[el]!=null)opts.push({k:"air",q:AIRQ[el]*thin,cap:Infinity});
  if((el==="H"||el==="O")&&waterNear())opts.push({k:"water",q:el==="H"?3.5:2,cap:Infinity});
  if(wallNear(G.p.x,G.p.y)){if(ROCKQ[el]!=null)opts.push({k:"rock",q:ROCKQ[el],cap:Infinity});if(el==="C"&&["Marsh Grotto","Salt-Sea Caves"].includes(G.biome.n))opts.push({k:"rock",q:4,cap:Infinity})}

  if(left>1e-9&&!(s&&s._noSynth)){const rc=recipeOf(el);if(rc){const sub=[];let cost=0,fq=0;const s2={...(s||{}),_noSynth:1};
      for(const a in rc.atoms){const r2=source(a,left*rc.atoms[a]/atomsPer(a),sub,s2);cost+=r2.qi;fq+=r2.forge*FORGE_QI}

      if(total<left*FORGE_QI){for(const r2 of sub){r2.sub=el;plan.push(r2)}rows.synth=left;rows.qi+=total;rows.synthTxt=synthLabel(s);left=0}}}
  rows.forge=left;plan.push(rows);return rows}
function wallNear(x,y){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(tile(x+dx,y+dy)===T.WALL)return true;return false}
function reactiveEl(k){const r=R[k];if(!r||!r.el)return false;return r.alkali||["F","P","Na","K","Li","Rb","Cs","Ca","Sr","Ba"].includes(k)}
function massOf(k){if(CMPD[k])return CMPD[k].M;if(OXSALT[k])return OXSALT[k].M;const r=R[k];if(!r)return 50;if(r.el)return massNum(r.z);
  const MM={vinegar:60,citric:192,muriatic:36.5,vitriol:98,lye:40,quicklime:56,bluestone:159.6,soda:84,chalk:100,sugar:342,water:18,naphtha:170,steam:18,dryice:44,smoke:80,fuelair:30,decaydust:230};return MM[k]||60}
// a burning fuel: real ΔH in its oxidizer, how much of it burns, and how its heat splits between flash and clinging burn
function burnLedger(k,ox,s,share,thin){const r=R[k];const per=burnDH(k,ox);const salt=OX[ox]&&OX[ox].salt;let frac=1;

function bfs(tx,ty,thru){const prev=new Int32Array(W*H).fill(-1);const s=idx(G.p.x,G.p.y);prev[s]=s;const q=[s];let h=0;
  while(h<q.length){const c=q[h++];if(c===idx(tx,ty))break;const cx=c%W,cy=(c/W)|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(!passable(nx,ny)||!G.seen[idx(nx,ny)])continue;
      if(dx&&dy&&(!passable(cx+dx,cy)||!passable(cx,cy+dy)))continue;const n=idx(nx,ny);if(prev[n]!==-1)continue;if(!thru&&mobAt(nx,ny)&&!(nx===tx&&ny===ty))continue;prev[n]=c;q.push(n)}}
  const t=idx(tx,ty);if(prev[t]===-1)return null;const path=[];let c=t;while(c!==s){path.push(c);c=prev[c]}return path.reverse()}

PROCS.pump={req:"an empty vessel or one holding water, beside a pool",n:"Pump · draw water from the pool with spare Qi",ok:v=>!v.el||v.el==="water",d:"While you stand by water, each beat it pulls water into this vessel using whatever Qi you have (0.01 Qi a measure, up to 300 measures a beat) until it's full — a slow way to fill a big vessel or keep a reactor's coolant topped up.",

// A steam generator is a heat exchanger: the reactor's hot coolant stays sealed in its own loop, and this vessel's water boils
// from the heat passed through the tube walls — clean steam for spells, and the core runs cooler and safer.
function hottestSource(v){let best=null,bt=-1;const hv=v.h??84;for(const x of G.vessels){if(x===v||x.inside||x.el!=="water"||x.h==null||x.h<=hv+5)continue;const T=x.h+(x.core?1e5:0);if(T>bt){bt=T;best=x}}return best}
// in a sealed vessel boiling water sits at the saturation temperature of its pressure, so more enthalpy means hotter water

PROCS.steamgen={req:"a vessel holding water (and a hotter vessel of water — a reactor core — to draw heat from)",n:"Steam generator · boil water with reactor heat",ok:v=>v.el==="water",
  d:"A heat exchanger: each beat it pulls heat from your hottest water vessel (a running reactor core first) through the tube walls, Q = U·A·ΔT, and boils this vessel's water. The core's radioactive coolant never mixes in, and taking its heat away keeps the core from boiling dry. Steam spells draw from the hottest vessel, so this one feeds them once it's hotter than the core's water.",
  step(v){if(v.h==null)v.h=84;const s=hottestSource(v);if(!s)return"No hotter water vessel to draw heat from.";const dT=satDT(s,v);if(dT<=.5)return`${esc(s.name)} isn't hotter than this.`;
    const UA=1.5*Math.sqrt(Math.min(s.V,v.V));const ks=Math.max(.05,vKg(s)),kv=Math.max(.05,vKg(v));let Q=UA*dT*BEAT_S;Q=Math.min(Q,((s.h)-(v.h))/(1/ks+1/kv)*.5);
    s.h-=Q/ks;v.h+=Q/kv;v.sgFrom=s.id;return`Drawing ${fmtPow(Q/BEAT_S)} from ${esc(s.name)} (${fN(vTC(s))} °C) · ${vPhase(v)}, ${fN(vPressure(v),1)} bar.`}};

  Bi:["Po","²⁰⁹Bi + n → ²¹⁰Bi → ²¹⁰Po (β⁻)","Polonium-210: an intense alpha emitter."],
  N:["iso_C_14","¹⁴N + n → ¹⁴C + p","Carbon-14 (t½ 5,730 years)."],

PROCS.bombard={req:"a vessel holding uranium, thorium, lithium, cobalt, bismuth, nitrogen or boron",n:"Neutron bombardment · transmute by neutron capture",ok:v=>!!bombTarget(v),
  d:"Floods the contents with neutrons so nuclei capture them and transmute: U-238 breeds plutonium-239, thorium breeds U-233, lithium-6 gives tritium, cobalt becomes cobalt-60. The neutrons come from the best source available: a running reactor core (put this vessel inside one — by far the most), a beryllium + alpha-emitter mix in this vessel (radium or polonium with Be: (α,n) like the first neutron sources), or else a Qi-driven fusor (2 Qi a beat, slow). The vessel itself becomes radioactive.",
  step(v){const t=bombTarget(v);if(!t)return"Nothing here captures neutrons usefully.";const [prod,eq,why]=BOMB[t];
    if(prod==="iso_U_233")ensureIso(prod,"Uranium-233","U-233",why);if(prod==="iso_Co_60")ensureIso(prod,"Cobalt-60","Co-60",why);if(prod==="iso_C_14")ensureIso(prod,"Carbon-14","C-14",why);

    else{const mx=v.el==="mix"?v.mix:{};const em=ALPHA_EM.reduce((a,k)=>a+(mx[k]||0),0);if(em>0&&(mx.Be||0)>0){rate=.002*Math.min(mx.Be,em);src="Be(α,n) source"}

    if(!v.bombSaid){v.bombSaid=1;codexAdd("bomb_"+t,`Neutron capture: ${R[t].n} → ${R[prod].n}`,eq,why)}
    return`${src}: +${fN(amt,amt<.01?4:3)} ${R[prod].n} (${fN(vesselMixHas({...v,inside:null},prod),2)} so far) · ${eq}`}};

function vesselBeat(){const notes=[];
  for(const v of [...G.vessels]){if(!G.vessels.includes(v))continue;if(v.charge>0)v.charge*=.995;if(v.core){coreBeat(v);if(!G.vessels.includes(v))continue}
    if(v.proc&&PROCS[v.proc]){const P=PROCS[v.proc];if(!P.ok(v)&&!(v.proc==="liquefy"&&v.el==="N")&&!(v.proc==="freezeco2"&&v.el==="dryice")){v.status="Wrong contents for this process.";}else v.status=P.step(v)}

      if(v.el==="Fe"&&T>VMELT[v.mat]){say(`<b>${esc(v.name)}</b>'s ${VMAT[v.mat].n.toLowerCase()} walls melt at ${fN(VMELT[v.mat])} °C — the iron pours out!`);const q=vKg(v)*v.h;hurtPlayer(eDmg(q*.3,1),"self","fire");G.vessels=G.vessels.filter(x=>x!==v);continue}
      if(!(v.hold&&payQi(leak/QI_KJ)))v.h=Math.max(0,v.h-leak/Math.max(.001,vKg(v)))}

const ROCKHARD=[3,6,2.5,4,6,7];// Marsh limestone, volcanic basalt, salt, frozen granite, ore veins, furnace
const QUARRYORE=[["C","Ca","Fe"],["Fe","S","Cu"],["Na","Mg","Ca"],["Ti","Si","Fe"],["Fe","Cu","Sn","Zn","Ag","Au","W"],["W","Pt","U","Th","Os"]];

  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(inb(x+dx,y+dy))G.seen[idx(x+dx,y+dy)]=1;

function mineAt(x,y){if(G.meleeCD>0)return;const pk=equipped("tool");
  if(!pk){say("You need a pickaxe to mine. Open Pack → Gear forge and shape one.");G.meleeCD=.6;return}
  if(x<=0||y<=0||x>=W-1||y>=H-1){say("That's the bedrock edge of the floor. Nothing can break it.");G.meleeCD=.6;return}

  const tcards=MOLTARGETS.map(t=>{const d=MOLDEX[t[0]];
    if(d)return`<div class="mol"><span class="f">${t[0]}</span><b>${t[1]}</b><span>${t[4]}</span><span>Formed from ${R[t[2]].sym} + ${t[3]==="O"?"O₂":t[3]+"₂"}</span></div>`;
    if(MOLHINT[t[0]])return`<div class="mol hint"><span class="f">${t[0]}</span><b>${t[1]}</b><span>From a scroll: burn ${R[t[2]].n.toLowerCase()} in ${t[3]==="O"?"air or oxygen":R[t[3]].n.toLowerCase()} to form it.</span></div>`;
    return`<div class="mol lock"><span class="f">???</span><b>Undiscovered</b><span>${t[0].replace(/[A-Z][a-z]?/g,m=>"·")} — burn two elements together in a spell, or find a scroll.</span></div>`}).join("");
  const xcards=extra.map(f=>`<div class="mol"><span class="f">${f}</span><b>${MOLDEX[f].n}</b><span>Formed from ${MOLDEX[f].from.map(k=>R[k]?R[k].sym:k).join(" + ")}</span></div>`).join("");
  const castK=["marsh","silane","acet","propane","naphtha","steam","dryice","smoke","fuelair","decaydust","water","vinegar","citric","muriatic","vitriol","lye","quicklime","bluestone","soda","chalk","sugar"].concat(Object.keys(R).filter(k=>R[k].custom));
  const ccards=castK.map(k=>{const r=R[k];if(G.known[k]||k==="water")return`<div class="mol"><span class="f">${r.sym}</span><b>${r.n}</b><span>${r.d}</span><span>Carrying: ${isGas(k)?vesselHas(k)+" in vessels":(G.pouch[k]||0)+" in pouch"}</span>${CAST_CATS.has(r.cat)?`<button data-molforge="${k}">Forge with it</button>`:""}</div>`;
    return`<div class="mol lock"><span class="f">???</span><b>Unknown compound</b><span>Find it in a vein, a chest, or a scroll.</span></div>`}).join("");
  sheet(`<div class="hrow"><h2>Molecules</h2><div class="chips"><button id="mtable">Elements</button><button id="close">Close</button></div></div>
  <p>Every molecule you've made or carry. Burn an element in air, oxygen or a halogen and its product is recorded here. Scrolls from chests and the floor reveal the ones you haven't found yet. The Molecules page carries over between descents.</p>
  <div><h3>Formed in your spells · ${found} of ${MOLTARGETS.length}</h3><div class="molgrid">${tcards}${xcards}</div></div>
  <div><h3>Compounds you can cast</h3><div class="molgrid">${ccards}</div></div>
  <div class="hrow"><button id="mpart">🧪 3D molecule builder</button><button class="pri" id="close2">Back to the dungeon</button></div>`);
  $("mtable").onclick=()=>openTable("view");$("close2").onclick=closeSheet;$("mpart").onclick=molBuilder;
  for(const b of document.querySelectorAll("[data-molforge]"))b.onclick=()=>{const e=G.spells.findIndex(s=>!s);openForge(e>=0?e:0);F._setR(b.dataset.molforge);renderForge()}}

   <label class="chip${GF.body?" on":""}" style="width:max-content"><input type="checkbox" id="gbody" ${GF.body?"checked":""} style="accent-color:#e0b84a"> Draw carbon from my own body (costs HP)</label>

let GF={slot:"tool",mat:"iron",body:0};
function openCodex(){const ids=Object.keys(CODEX).sort((a,b)=>CODEX[a].t-CODEX[b].t);
  sheet(`<div class="hrow"><h2>Codex of Reactions</h2><button id="close">Close</button></div>

  ${ids.length?`<div class="codex">${ids.map(k=>{const c=CODEX[k];return`<div><b>${esc(c.n)}</b><span class="eq">${c.eq}</span><span>${c.be}</span></div>`}).join("")}</div>`:`<p class="warn">Empty. Cast a technique to record its first reaction.</p>`}

function openGuide(first){const seenMobs=[...new Set(G.mobs.filter(m=>G.seen[idx(m.x,m.y)]).map(m=>m.type))];
  sheet(`<div class="hrow"><div><p style="letter-spacing:.12em;text-transform:uppercase;font-size:11px">Conserved Heaven</p><h1 class="title">Depths</h1></div><span class="seal">守<br>恒</span></div>
  <p>A blocky cultivator descends through marsh, vents, salt caves, ice and ore. Every technique obeys one law: energy and matter are conserved. Qi only shapes, gathers and compresses; the chemistry has to bring the heat.</p>
  <ul class="guide" style="padding-left:18px;margin:0">
   <li><b>Move</b>: drag the joystick at bottom left, or tap a tile to walk there. Drag elsewhere to turn the camera; pinch to zoom. Walk into a beast to strike it.</li>
   <li><b>Cast</b>: tap a technique, then a lit tile. Tap the technique again to fire at the nearest beast. Long-press to reforge it.</li>
   <li><b>Meditate</b>: tap yourself or the Meditate button. Qi returns three times as fast until you move.</li>
   <li><b>All 118 elements</b>: open Elements to read any of them and use it in the Forge. Fuels burn in air, oxygen or halogens; noble gases glow as plasma; dense metals fly as slugs; radioactive ones need a shielded shell. Superheavies must be forged.</li>
   <li><b>Real energies</b>: every reaction pays out its real heat — ΔH in kJ per mole × 0.1 mol per measure — and a body takes about 0.7 HP per kJ that actually reaches it. A fireball in open air only burns ~60% of a thrown fuel and only ~30% of its heat lands on what it engulfs; acids and bases react inside the flesh itself; reactions in a splash (brine, slaking lime, plating, dissolving metal) lose some heat to the runoff. The Forge shows every number.</li>
   <li><b>Cold, steam, molten metal, slugs and plasma</b>: these are paid in Qi, and Qi buys only real joules. Set the <b>Amount</b> in grams: a few drops of liquid nitrogen skitter off on their own vapour (Leidenfrost) and do nothing, while kilograms soak in and freeze a beast — about 8 kJ pulled per kg of body. Steam at 100 °C drifts and barely scalds; superheated steam held under pressure in the shell leaves as a jet that hits hard up close and cools as it mixes with air. Liquid iron sticks and burns as it freezes; past 2,862 °C it boils to a vapour cloud that burns in air. A slug's damage is ½mv², minus what air drag takes; its Qi cost climbs with mass and speed, and light or supersonic slugs fight more drag. Plasma pays the real ionization energy and dumps its heat into the air within a metre or two — a Lance carries it as a jet, and it runs along gas clouds. The <b>Fusion Vessel</b> fuses deuterium with tritium or helium-3 built in the Particle Forge; D–T gives the most but floods the area with neutrons. Decay dust only recycles radioactive matter.</li>
   <li><b>Vessels that keep working</b>: tap <b>Reactor…</b> on any vessel to run a process every beat. A liquefier makes liquid nitrogen from the air at half the Qi of chilling it mid-fight; a boiler heats water to superheated steam (watch the pressure rating) with Qi or by burning marsh gas, hydrogen or charcoal under it; a tungsten or Qi-walled furnace melts and boils iron. Baking soda + vinegar fills a vessel with CO₂ for free, and a freezer turns it to dry ice. Acid + zinc makes hydrogen, electrolysis splits water, a Sabatier reactor (nickel catalyst) turns CO₂ and hydrogen into marsh gas, Haber (iron catalyst, 150 bar) makes ammonia, Ostwald (platinum) turns it into nitric acid, and nitric acid + potassium crystallizes saltpeter; yeast ferments sugar into ethanol. Hot and cold contents leak heat through their walls — hold their temperature with Qi, or let them drift. Casts draw from these vessels first and only pay for what isn't ready.</li>
   <li><b>Pools</b>: a pool within reach gives water almost free, and its dissolved matter too — salt-sea pools are seawater (sodium, chlorine, magnesium, sulfur, calcium, potassium, bromine…), marsh pools bubble methane. Elsewhere pools are fresh and their salts cost more to concentrate.</li>
   <li><b>Radioactive metals</b>: thrown as dense slugs — uranium and plutonium weigh almost twice what lead does per cm³, so the same size slug costs more Qi and hits harder. A slug that lodges keeps irradiating at its real decay power: uranium and thorium do practically nothing, polonium and californium are lethal. Short-lived elements cost more to forge because they decay as you build them, and superheavy elements can't be thrown at all. Radon goes out as a radioactive cloud.</li>
   <li><b>Compounds from elements</b>: when you're out of a compound (marsh gas, sticky fire, the fuel-air charge, acids, saltpeter, your own molecules…), the Forge builds it from its elements — from your pouch, vessels, the air, a pool or rock — if that's cheaper than forging it. A catalyst in your pouch (platinum, nickel, iron…) cuts the activation Qi by 60%, and a hot boiler or furnace cuts another 25%.</li>
   <li><b>Mixed vessels and charge</b>: “Mix another reagent in” lets one vessel hold several reagents; a Synthesizer reactor then combines them into any recipe they make. A Thundercloud vessel (water, faster in the cold) or a Capacitor (Qi) stores charge that Heaven Spark techniques spend before Qi. In the Forge you can add electrons to any mix, add a vessel's contents, or throw a whole vessel.</li>
   <li><b>Mixing</b>: every reagent stacked into a technique has its own measures slider. Oxidizers are ordinary ingredients — add oxygen, halogens, saltpeter and perchlorate together in any amounts. The Forge balances them against the fuels in oxygen-equivalents (O₂ 2, a halogen 1, saltpeter 2.5, perchlorate 4 per measure): what they cover burns completely inside the mix, anything left burns in open air, and extra oxidizer is wasted. The ledger tells you how many casts the matter you carry covers and which ingredient runs out first.</li>
   <li><b>Blasting rock</b>: rock breaks by the real powder factor — about 0.1 × hardness kg of TNT per cubic metre when the charge is packed against it, roughly three times that for an open charge, falling off quickly with distance. Small charges only crack walls; cracks add up across blasts and your pickaxe finishes cracked rock fast.</li>
   <li><b>Isomers</b>: the same atoms bonded differently are a different molecule, with their own heat of formation, density, crystal form and stability — ethanol or dimethyl ether, propene or cyclopropane, benzene or prismane, urea or ammonium cyanate, isocyanic, cyanic or fulminic acid. Known isomers use measured values; anything else is estimated from its bonds, ring strain and aromatic stability. A shape the atoms can't hold (too many bonds, loose radicals, pieces not joined) snaps at once into a stable arrangement and gives off the difference — gently, as a hot flash, or as an explosion if it's more than ~1 kJ per gram. Strained or weakly bonded isomers keep for a while (half-life from the barrier set by their weakest bond) and slowly convert in your pouch; very low barriers make explosives sensitive to handling.</li>
   <li><b>Molecule builder</b>: tap an atom to select it, choose single, double or triple, then tap another atom to bond them — or add new atoms straight onto the selected one. Leave it alone and the game guesses the bonds. Your bonds set the heat of formation.</li>
   <li><b>Oxidizers</b>: halogens give each fuel its real halide heat (hydrogen in fluorine is almost double hydrogen in oxygen; hydrogen in iodine doesn't burn at all). Saltpeter (KNO₃) and perchlorate (KClO₄) carry their own oxygen, so the mix burns completely with no air — even in thin air — and needs no inner shell. Charcoal + sulfur + saltpeter is black powder.</li>
   <li><b>Blast physics</b>: a charge's heat scorches what its fireball engulfs, and a share becomes a shock wave whose overpressure falls with distance ÷ cube root of the charge (Kinney–Graham). A loose fuel only deflagrates (~3% blast); a confined nitrate mix bursts its shell (~35%); a molecule that carries its own oxygen detonates. The wave reaches you too, and cracks rock when it's strong enough.</li>
   <li><b>Firework Shell</b>: pack a fuel, an oxidizer and colourants into one shell. Each element burns its real emission colour (strontium red, barium green, copper blue, sodium yellow, potassium lilac); magnesium and aluminium flash white and dazzle, iron and charcoal throw gold sparks. The burst widens with the cube root of the charge's mass.</li>
   <li><b>Fur, skin and armor</b>: beasts have real cover. A wolf's winter coat stops most of a quick flash of heat and nearly all cold, but fur chars, catches and smoulders, and lye dissolves it (hair is keratin). Wet toad skin shrugs off flashes but soaks up chemicals. Acid eats a crab's chalk shell measure by measure. Your robe and armor work the same way: metal plate reflects heat, gold and titanium resist acid, cloth can catch fire.</li>
   <li><b>Molecules the body answers to</b>: build caffeine, nicotine, adrenaline, ethanol, LSD, psilocybin, mescaline, DMT, THC, morphine, cocaine, capsaicin or melatonin in the Molecule Builder (type the formula). Cast them and they land as doses scaled to the beast's body mass — a mite overdoses, an ox barely notices, gas and bronze feel nothing. Take them yourself from the Pack: stimulants speed casting, sedatives and psychedelics throw off your aim, and stacking past the limit overdoses you.</li>
   <li><b>Custom chemistry</b>: pair an acid, base or blue vitriol with a partner. Acid + chalk makes foam, acid + a reactive metal makes hydrogen mist you can light, acid + lye makes brine pools that conduct lightning. The Forge shows what everything becomes.</li>
   <li><b>Molecule charges</b>: beyond the elements you can forge and loot compound charges — Sticky Fire (hot), Dry Ice (cold cloud), Acrid Smoke (choking), Decay Dust (radioactive) and the Fuel-Air Charge. With the <b>Detonation</b> shape a fuel-air charge becomes a wide overpressure blast that throws beasts back.</li>
   <li><b>Compose anything</b>: in the Forge, stack as many elements and molecules into one technique as you like (there's no limit). Fuels burn together, payloads add their effects, and reactive metals and halogens need heavy Qi containment or they react in your hand.</li>
   <li><b>Particle forge</b>: build matter from the bottom up — set protons for the element, neutrons for the isotope — and assemble elements, radioactive isotopes, or whole molecules atom by atom, paid in Qi by E = mc². What you build lands in your pouch, ready to cast.</li>
   <li><b>Split the Atom</b>: the Detonation shape has a sibling, <b>Split the Atom</b>. Qi pushes heavy nuclei over the fission barrier; the real binding-energy difference (semi-empirical mass formula) comes back as blast, heat, prompt radiation and fallout. Uranium-class nuclei return ~30× the push, lead only a few times. Ionizing radiation is far deadlier per joule than heat and falls with the square of distance: cast it at full range, seal it in a shielded shell, wear lead.</li>
   <li><b>Matter is conserved</b>: nothing you cast vanishes. Metals and slugs fall to the floor as slag you can walk over and harvest back; gases and flames disperse into the air. Beasts are made of matter too — an iron ox leaves iron, a crab leaves its carbonate shell, a bronze golem leaves copper and tin — all harvestable from the body. Radioactive matter doesn't just end: it decays over several beats into its daughter element (heavy nuclei settle toward lead), which you can then gather.</li>
   <li><b>Air, water, rock and your body</b>: oxygen and nitrogen are pulled from the air almost free — they only need separating. The carbon and hydrogen in air, water and rock are already burned (CO₂, H₂O, oxides), so un-burning them costs about what burning would give back. Your body is different: its fat and sugar are unburned fuel, so drawing carbon, hydrogen and oxygen from yourself is cheap in Qi but costs HP. Turn on “Draw from my own body” in the Forge.</li>
   <li><b>Roll</b>: tap the Roll button (or double-tap the joystick, or Shift) to dash a couple of tiles with a roll. You can't be hit mid-roll.</li>
   <li><b>Mining and the quarry</b>: tap a wall beside you, or walk into it, to swing your pickaxe. Each floor's rock has a hardness, and your pick must be close to it. One room per floor is a quarry (look for the 採石 sign) whose walls glint with ore. A strong enough Detonation cracks rock open too. Rubble and ore land on the floor to gather.</li>
   <li><b>Pack and gear forge</b>: the Pack holds your equipment slots — pickaxe, helm, chestplate, gauntlets, boots. Shape any of them from flint, copper, bronze, iron, steel, titanium, gold, lead, tungsten carbide or diamond, paid in Qi for the matter. Lead blocks fallout, gold shrugs off acid, and melting gear down returns 60% of its metal.</li>
   <li><b>Vessels and molecules</b>: vessels can be formed from any wall material, from glass to tungsten, and stronger materials hold higher pressure. The Molecules page records every product your spells form; scrolls reveal the rest.</li>
   <li><b>Why Qi jumps</b>: casting spends your matter. The next cast fills the gap the cheapest way it can — air, a pool, rock, building compounds from their elements — and only forges from bare nucleons (12 Qi a measure) what nothing else can supply. Stand by a vein, harvest remnants, or refill to keep techniques cheap.</li>
   <li><b>Reactor cores</b>: open a vessel of 8 L or more in 3D (“Open in 3D” on its card) and arrange smaller vessels on its grid: enriched uranium or plutonium fuel, water/graphite/heavy-water moderators, boron or cadmium absorbers. Fill the big vessel with water. Neutrons are tracked cell to cell, so the layout decides k. Keep boron between fuel, withdraw the rods slowly, watch k and the coolant. Past one dollar of reactivity it goes prompt critical; let the water boil or vent away and decay heat melts the fuel. Either way you get a steam explosion and a fallout field. The coolant&#39;s steam feeds your steam spells, and an aimed spell lists its materials and their sources in the top left.</li>
   <li><b>Qi vessels</b>: gases can only be carried in vessels. Form one, pressurize an element into it, and take it with you. Stay under the rating or it ruptures.</li>
   <li><b>Cultivation</b>: essence comes from beasts, spirit stones and Dao Tablets. When the bar fills, pass a <b>Heart Trial</b> of chemistry questions to break through.</li>
   <li><b>Loot</b>: wooden, jade and golden chests hold elements, pills, tablets, sect manuals, vessels and relics.</li>
  </ul>
  ${seenMobs.length?`<div><h3>Beasts on this floor</h3>${seenMobs.map(k=>`<p style="margin-bottom:6px"><b style="color:${MOB[k].c}">${MOB[k].g} ${MOB[k].n}</b>: ${MOB[k].tip}${COVER[k]?` <i>Cover: ${COVER[k].k} — lets through ${Math.round(COVER[k].heat*100)}% of a heat flash, ${Math.round(COVER[k].cold*100)}% of cold.</i>`:""}${MASSKG[k]?` ~${fN(MASSKG[k],MASSKG[k]<1?3:0)} kg.`:""}</p>`).join("")}</div>`:""}
  <p class="floor">Best run: floor ${LS.get("chd.best",1)} · keyboard: WASD move, Q/E turn, 1–5 cast, space meditate</p>
  <button class="pri" id="close">${first?"Enter the depths":"Back to the dungeon"}</button>`)}

/* ---------- saving: whole runs in slots, and a separate spell book ---------- */
// Saves go to your claude.ai account (private to you) when the page can reach it, and always to this browser too.
let CLOUD=null;
(async()=>{try{if(!window.claude||!window.claude.use)return;const db=await window.claude.use("db"),user=await window.claude.use("user");if(!db||!user)return;const uid=await user.id();if(uid){CLOUD={db,uid};refreshSheetIfSaves()}}catch(e){}})();
const cloudDoc=k=>CLOUD.db.doc(`data/users/${CLOUD.uid}/cheaven/${k}`);
const cloudColl=()=>CLOUD.db.collection(`data/users/${CLOUD.uid}/cheaven`);
function refreshSheetIfSaves(){const sh=$("sheet");if(sh&&!sh.hidden&&(sh.dataset.kind==="saves"||sh.dataset.kind==="book")){if(sh.dataset.kind==="saves")openSaves();else openSpellBook(false)}}
// custom molecules/isotopes the player built aren't in the base R table, so a save carries their definitions
function customReagents(){const out={};for(const k in R)if(R[k].custom)out[k]=R[k];return out}
function restoreCustom(cr){if(!cr)return;for(const k in cr){if(!R[k]){R[k]=cr[k];if(R[k].cat==="acid"&&!ACIDS.includes(k))ACIDS.push(k)}}}
// what a run is: everything in G except the render handles, which rebuild from the data
function snapshotRun(){const g=JSON.parse(JSON.stringify(G,(k,v)=>(k==="el"||k==="view")&&v&&typeof v==="object"||k==="wm"||k==="fm"||k==="stairMesh"||(v&&typeof v==="object"&&(v.metadata&&v.object||v.isObject3D||v.isMaterial||v.isBufferGeometry||v.isTexture))?undefined:v));
  return{kind:"run",v:3,t:Date.now(),seed,floor:G.floor,realm:REALMS[G.p.realm].n,G:g,
    mol:{dex:MOLDEX,hint:MOLHINT},customR:customReagents()}}
function rebuildScene(){if(typeof ov!=="undefined"&&ov)for(const c of [...ov.children])c.remove();
  if(typeof mobGroup!=="undefined"&&mobGroup)for(const c of [...mobGroup.children]){mobGroup.remove(c);c.traverse&&c.traverse(o=>o.material&&o.material.dispose&&o.material.dispose())}
  G.dirty={world:1,props:1,reveal:1,mobs:1}}
function loadRun(s){if(!s||!s.G)return false;restoreCustom(s.customR);
  seed=s.seed>>>0;G=s.G;
  for(const a of ["map","seen","vis"])if(G[a]&&!Array.isArray(G[a]))G[a]=Object.values(G[a]);
  if(s.mol){MOLDEX=s.mol.dex||MOLDEX;MOLHINT=s.mol.hint||MOLHINT;LS.set("chd3.moldex",MOLDEX);LS.set("chd3.molhint",MOLHINT)}
  for(const mb of G.mobs){delete mb.el;delete mb.view}
  // older saves dropped every "el" field: drop veins that lost their element, and recover vessel contents where we can
  for(const k in G.veins||{}){const v=G.veins[k];if(!v||!v.el||!R[v.el])delete G.veins[k]}
  for(const v of G.vessels||[]){if(v.el&&!R[v.el]&&v.el!=="mix"){v.el=null;v.n=0}if(!v.el&&v.n>0){if(v.mix&&Object.keys(v.mix).length)v.el="mix";else if(v.h!=null||v.core)v.el="water";else if(v.cold)v.el="N";else{const m=String(v.name).match(/^(\S+) (pin|rod)$/);const k=m&&Object.keys(R).find(x=>R[x].sym===m[1]||x===m[1]);if(k)v.el=k;else{v.n=0;v.h=null;v.cold=0}}}}
  for(const k in G.items||{}){const it=G.items[k];if(!it||!it.kind)delete G.items[k]}
  // transient state never carries over; fill anything an older save lacks
  const P=G.p;for(const k of ["hp","qi","realm","ess","burn","pills","qpills","stones","tablets","bHP","bQi","bM","x","y","fx","fz","face"])if(typeof P[k]!=="number"||!isFinite(P[k]))P[k]=k==="hp"?1:0;
  if(P.fx===0&&P.fz===0){P.fx=P.x;P.fz=P.y}P.dash=null;P.iframe=0;G.walk=null;G.walkAware=null;G.meditating=false;G.beatT=0;G.vbeatT=0;G.over=false;
  for(const k of ["mobs","clouds","traps","decaying","vessels","spells"])if(!Array.isArray(G[k]))G[k]=G[k]?Object.values(G[k]):[];
  for(const k of ["veins","items","relics","manuals","known","remains","oreWalls","dirty"])if(!G[k]||typeof G[k]!=="object")G[k]={};
  for(const k in G)if(G[k]&&typeof G[k]==="object"&&!Array.isArray(G[k])&&(G[k].uuid||G[k].isObject3D||G[k].geometry||G[k].metadata))G[k]=null;delete G.wm;delete G.fm;delete G.stairMesh;
  try{if(typeof aimSlot!=="undefined"&&aimSlot>=0)cancelAim()}catch(e){}
  if(typeof V3!=="undefined"&&V3.r){try{V3.r.dispose()}catch(e){}V3.r=null}loop.err=0;
  syncInfQi();rebuildScene();ui(true);return true}
// a save file the player keeps on their own device, safe from wiped browser storage
async function saveToFile(){const msg=t=>{const m=$("fmsg");if(m)m.textContent=t};if(G.over){msg("This run is over — start a new descent first.");return}
  const data=JSON.stringify({...snapshotRun(),file:"conserved-heaven-depths",book:spellBook()});const d=new Date();
  const name=`ConservedHeaven_F${G.floor}_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
  if(dl){try{await dl.save({filename:name,data});msg(`Saved ${name} (${fN(data.length/1024,0)} KB).`);say("Run saved to a file on your device.")}catch(e){msg(e&&e.code==="declined"?"Save cancelled.":"Couldn't save the file here ("+(e&&e.code||"error")+").")}return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);msg(`Saved ${name}.`)}catch(e){msg("This view can't save files.")}}
function loadFromFile(f){const msg=t=>{const m=$("fmsg");if(m)m.textContent=t};const rd=new FileReader();
  rd.onload=()=>{let s;try{s=JSON.parse(rd.result)}catch(e){msg("That file isn't a Conserved Heaven save.");return}
    if(!s||!s.G){msg("That file isn't a Conserved Heaven save.");return}
    if(Array.isArray(s.book)){const have=new Set(spellBook().map(e=>e.id));const b=spellBook().concat(s.book.filter(e=>e&&!have.has(e.id)));LS.set("chd3.book",b.slice(0,80))}
    if(loadRun(s)){closeSheet();say(`Loaded your save file: floor ${G.floor}, ${realm().n}.`)}else msg("Couldn't load that file.")};
  rd.onerror=()=>msg("Couldn't read that file.");rd.readAsText(f)}
// local slots live in localStorage; cloud slots mirror them to the account
const SLOTN=6;
function localSaves(){return LS.get("chd3.saves",{})}
async function writeSlot(slot,data){const o=localSaves();o[slot]=data;LS.set("chd3.saves",o);
  if(CLOUD)try{await cloudDoc("run_"+slot).set(data)}catch(e){}}
async function readSlots(){const out={};const L=localSaves();for(const k in L)out[k]={...L[k],where:"this browser"};
  if(CLOUD)try{const q=await cloudColl().where("kind","==","run").get();
    for(const d of q.docs){const m=d.id.match(/^run_(.+)/);if(!m)continue;out[m[1]]={...d.data(),where:out[m[1]]?"account + browser":"your account"}}}catch(e){}
  return out}
async function deleteSlot(slot){const o=localSaves();delete o[slot];LS.set("chd3.saves",o);if(CLOUD)try{await cloudDoc("run_"+slot).delete()}catch(e){}}
function timeAgo(t){if(!t)return"just now";const s=(Date.now()-t)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";return Math.floor(s/86400)+" d ago"}
function openSaves(){sheet(`<div class="hrow"><h2>Saves</h2><button id="close">Close</button></div>
  <p>Save the whole run — your floor, body, pouch, vessels, gear and bound spells — into a slot, and load it later. ${CLOUD?"Saved to your Claude account and to this browser, so you can pick a run up on another device.":"Saved in this browser. Open this game while signed in to Claude to also save to your account and carry runs between devices."}</p>
  <div class="vessel" style="border-color:var(--qi)"><b>Save file on your phone</b><p style="font-size:12.5px">Browser and account saves can get wiped. Save a small file to your phone (Files app / Downloads) — it holds this run, your bound spells and your Spell Book — and load it back any time, on any device.</p>
   <div class="chips"><button class="chip pri" id="fsave">Save to phone</button><button class="chip" id="fload">Load from file</button></div><input type="file" id="ffile" accept=".json,application/json,text/plain" hidden><p class="floor" id="fmsg"></p></div>
  <div id="saveslots"><p class="floor">Loading…</p></div>`);
  $("sheet").dataset.kind="saves";
  $("fsave").onclick=saveToFile;$("fload").onclick=()=>$("ffile").click();$("ffile").onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)loadFromFile(f)};
  readSlots().then(slots=>{const el=$("saveslots");if(!el)return;const rows=[];
    for(let i=1;i<=SLOTN;i++){const s=slots[i];
      rows.push(`<div class="vessel"><div class="hrow"><b>Slot ${i}</b><span class="floor">${s?s.where:"empty"}</span></div>
        ${s?`<p style="font-size:12.5px">Floor ${s.floor} · ${esc(s.realm||"?")} · saved ${timeAgo(s.t)}</p>`:""}
        <div class="chips"><button class="chip pri" data-savein="${i}">Save here</button>${s?`<button class="chip" data-loadslot="${i}">Load</button><button class="chip" data-delslot="${i}">Delete</button>`:""}</div></div>`)}
    el.innerHTML=rows.join("");
    for(const b of el.querySelectorAll("[data-savein]"))b.onclick=async()=>{if(G.over){say("This run is over — start a new descent first.");return}await writeSlot(+b.dataset.savein,snapshotRun());say(`Run saved to slot ${b.dataset.savein}.`);openSaves()};
    for(const b of el.querySelectorAll("[data-loadslot]"))b.onclick=async()=>{const s2=await readSlots();if(s2[b.dataset.loadslot]&&loadRun(s2[b.dataset.loadslot])){closeSheet();say(`Loaded slot ${b.dataset.loadslot}: floor ${G.floor}, ${realm().n}.`)}else say("Couldn't load that slot.")};
    for(const b of el.querySelectorAll("[data-delslot]"))b.onclick=async()=>{await deleteSlot(+b.dataset.delslot);openSaves()}})}
/* ---------- spell book: saved techniques, apart from your 5 bound slots ---------- */
function spellBook(){return LS.get("chd3.book",[])}
// a saved spell may use a custom molecule; carry its definition along so it survives a reload on any device
async function saveToBook(spell){const custom={};for(const k of [spell.r,...(spell.comp||[])])if(k&&R[k]&&R[k].custom)custom[k]=R[k];
  const entry={kind:"spell",...JSON.parse(JSON.stringify(spell)),custom,savedT:Date.now(),id:Math.random().toString(36).slice(2,9)};
  const b=spellBook();b.unshift(entry);if(b.length>80)b.length=80;LS.set("chd3.book",b);
  if(CLOUD)try{await cloudDoc("spell_"+entry.id).set(entry)}catch(e){}
  return entry}
async function readBook(){const out={};for(const e of spellBook())out[e.id]={...e,where:"this browser"};
  if(CLOUD)try{const q=await cloudColl().where("kind","==","spell").get();
    for(const d of q.docs){const data=d.data(),id=data.id||d.id;out[id]={...data,where:out[id]?"account + browser":"your account"}}}catch(e){}
  return Object.values(out).sort((a,b)=>(b.savedT||0)-(a.savedT||0))}
async function deleteFromBook(id){LS.set("chd3.book",spellBook().filter(e=>e.id!==id));if(CLOUD)try{await cloudDoc("spell_"+id).delete()}catch(e){}}
function loadSpellToForge(e){restoreCustom(e.custom);const{savedT,id,where,kind,custom,...sp}=e;
  F={name:"",p:null,ox:"air",shell:0,col:null,cat:null,comp:[],ms:null,...JSON.parse(JSON.stringify(sp))};if(!Array.isArray(F.comp))F.comp=[];renderForge()}
function openSpellBook(forForge){readBook().then(list=>{
  sheet(`<div class="hrow"><h2>Spell Book</h2><div class="chips">${forForge?'<button id="bkforge">Back to Forge</button>':""}<button id="close">Close</button></div></div>
   <p>Techniques you've saved, separate from your five bound slots. ${CLOUD?"Kept in your Claude account and this browser.":"Kept in this browser; sign in to Claude to carry them between devices."} ${forForge?"Load one into the Forge to cast or edit it.":"Open the Forge, shape a technique, and tap “Save to book”."}</p>
   ${list.length?`<div class="molgrid">${list.map(e=>{const parts=[e.r,...(e.comp||[])].map(k=>R[k]?R[k].sym:(e.custom&&e.custom[k]?e.custom[k].sym:k)).join(" + ");
     return`<div class="mol"><b>${esc(e.name||autoName(e))}</b><span>${esc(parts)}</span><span>${SHAPE[e.shape]?SHAPE[e.shape].n:e.shape}</span><span class="floor">${e.where}</span>
       <div class="chips"><button class="chip pri" data-bkload="${e.id}">Load to Forge</button><button class="chip" data-bkdel="${e.id}">Delete</button></div></div>`}).join("")}</div>`:`<p class="warn">Empty. Shape a technique in the Forge and tap “Save to book”.</p>`}`);
  $("sheet").dataset.kind="book";
  const bf=$("bkforge");if(bf)bf.onclick=()=>openForge(FSLOT);
  for(const b of document.querySelectorAll("[data-bkload]"))b.onclick=()=>{const e=list.find(x=>x.id===b.dataset.bkload);if(e){loadSpellToForge(e);say(`Loaded <b>${esc(e.name||autoName(e))}</b> into the Forge.`)}};
  for(const b of document.querySelectorAll("[data-bkdel]"))b.onclick=async()=>{await deleteFromBook(b.dataset.bkdel);openSpellBook(forForge)}})}

/* ---------- boot ---------- */
try{restoreCustom(LS.get("chd3.customR",{}))}catch(e){}
init3D();newGame();try{ui(true)}catch(e){console.error(e)}requestAnimationFrame(loop);openGuide(true);
</script>
